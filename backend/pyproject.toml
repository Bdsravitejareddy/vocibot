[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vocibot-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]
local = ["numpy>=2.0,<3", "faster-whisper>=1.1,<2", "silero-vad>=5.1,<6", "whisperx>=3.3,<4", "pyannote.audio>=3.3,<4"]
indic-asr = ["nemo_toolkit[asr]"]
desktop = ["pyinstaller>=6.10,<7"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
